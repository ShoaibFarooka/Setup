<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons (public/): .ico for older browsers, SVG (sharp, follows the dark theme) for the rest, PNG for iOS home screens -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
    <!-- Sets the theme before the first paint so the page never flashes the wrong one (same steps as src/lib/theme.js) -->
    <script>
      (function () {
        var preference = 'system';
        try { preference = localStorage.getItem('theme') || 'system'; } catch (e) {}
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
