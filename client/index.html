<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons (public/): .ico for older browsers, SVG (sharp, follows the dark theme) for the rest, PNG for iOS home screens -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
    <!-- Sets the theme before the first paint so the page never flashes the wrong one (same steps as src/lib/theme.js) -->
    <script>
      (function () {
        var preference = 'system';
        try { preference = localStorage.getItem('theme') || 'system'; } catch (e) {}
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
      // The language and text direction, also before the first paint (same steps as src/lib/i18n.js)
      (function () {
        var directions = { en: 'ltr', ar: 'rtl' };
        var language = null;
        try { language = localStorage.getItem('language'); } catch (e) {}
        if (!directions[language]) {
          var browser = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          language = 'en';
          for (var i = 0; i < browser.length; i++) {
            var code = String(browser[i] || '').split('-')[0].toLowerCase();
            if (directions[code]) { language = code; break; }
          }
        }
        document.documentElement.lang = language;
        document.documentElement.dir = directions[language];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
